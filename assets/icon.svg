<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bt-tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2c"/>
      <stop offset="1" stop-color="#121212"/>
    </linearGradient>
    <linearGradient id="bt-edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
  </defs>

  <!-- Tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bt-tile)"/>
  <rect x="9" y="9" width="238" height="238" rx="55" fill="none" stroke="url(#bt-edge)" stroke-width="2"/>

  <!-- Brightness: half-filled sun -->
  <g transform="translate(128 128)" fill="none" stroke="#f5f5f5" stroke-linecap="round">
    <circle r="38" stroke-width="12"/>
    <path d="M0 -38 A38 38 0 0 1 0 38 Z" fill="#f5f5f5" stroke="none"/>
    <g stroke-width="12">
      <line x1="0" y1="-64" x2="0" y2="-80"/>
      <line x1="0" y1="64" x2="0" y2="80"/>
      <line x1="-64" y1="0" x2="-80" y2="0"/>
      <line x1="64" y1="0" x2="80" y2="0"/>
      <line x1="45.3" y1="-45.3" x2="56.6" y2="-56.6"/>
      <line x1="-45.3" y1="-45.3" x2="-56.6" y2="-56.6"/>
      <line x1="45.3" y1="45.3" x2="56.6" y2="56.6"/>
      <line x1="-45.3" y1="45.3" x2="-56.6" y2="56.6"/>
    </g>
  </g>
</svg>
