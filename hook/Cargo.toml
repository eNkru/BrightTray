[package]
name = "brighttray-hook"
version = "0.2.1"
edition = "2021"
license.workspace = true
build = "build.rs"

[lib]
name = "brighttray_hook"
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.58"
features = [
    "Foundation",
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Pipes",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_WinRT",
]

[build-dependencies]
embed-resource = "2.5"
