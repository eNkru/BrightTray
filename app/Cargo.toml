[package]
name = "brighttray-app"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "BrightTray"
path = "src/main.rs"

[dependencies]
brighttray-helper = { path = "../helper" }
serde_json = "1"
tao = "0.31"
wry = "0.47"
tray-icon = "0.19"
window-vibrancy = "0.5"

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
embed-resource = "2.5"
