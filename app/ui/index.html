<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightTray</title>
<style>
  :root {
    color-scheme: light dark;
    --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;

    --bg-solid: #f3f3f3;
    --bg-mica: rgba(246, 246, 248, 0.8);
    --text: #1b1b1f;
    --text-2: #5c5f6b;
    --text-3: #8b8e99;
    --card: rgba(255, 255, 255, 0.72);
    --card-hover: rgba(255, 255, 255, 0.92);
    --stroke: rgba(0, 0, 0, 0.07);
    --stroke-strong: rgba(0, 0, 0, 0.14);
    --accent: #4a52f0;
    --accent-2: #6b3bea;
    --accent-soft: rgba(74, 82, 240, 0.12);
    --amber: #ff9a1f;
    --amber-2: #ffd24a;
    --ok: #0f9d58;
    --warn: #c25e00;
    --warn-soft: rgba(255, 154, 31, 0.13);
    --err: #c42b1c;
    --err-soft: rgba(196, 43, 28, 0.1);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 4px 16px rgba(0, 0, 0, 0.04);
    --skeleton: rgba(0, 0, 0, 0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-solid: #202020;
      --bg-mica: rgba(26, 26, 31, 0.82);
      --text: #f3f3f5;
      --text-2: #b3b6c2;
      --text-3: #80838f;
      --card: rgba(255, 255, 255, 0.055);
      --card-hover: rgba(255, 255, 255, 0.09);
      --stroke: rgba(255, 255, 255, 0.07);
      --stroke-strong: rgba(255, 255, 255, 0.14);
      --accent: #7c8bff;
      --accent-2: #a27bff;
      --accent-soft: rgba(124, 139, 255, 0.16);
      --ok: #3ddc84;
      --warn: #ffb347;
      --warn-soft: rgba(255, 179, 71, 0.12);
      --err: #ff6b5e;
      --err-soft: rgba(255, 107, 94, 0.12);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
      --skeleton: rgba(255, 255, 255, 0.06);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: var(--bg-solid);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  body.mica { background: var(--bg-mica); }
  button { font: inherit; color: inherit; }

  /* ── Title bar ─────────────────────────────── */
  .titlebar {
    height: 40px;
    flex: none;
    display: flex;
    align-items: center;
    padding-left: 14px;
  }
  .brand { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--text-2); flex: 1; height: 100%; }
  .brand svg { width: 18px; height: 18px; }
  .win-btn {
    width: 46px; height: 40px; border: 0; background: transparent;
    display: grid; place-items: center; cursor: default;
    transition: background .12s;
  }
  .win-btn svg { width: 10px; height: 10px; stroke: var(--text); stroke-width: 1; fill: none; }
  .win-btn:hover { background: var(--card-hover); }
  .win-btn.close:hover { background: #c42b1c; }
  .win-btn.close:hover svg { stroke: #fff; }

  /* ── Layout ────────────────────────────────── */
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 6px 24px 22px;
    min-height: 0;
  }
  .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
  .hero-icon { width: 52px; height: 52px; flex: none; filter: drop-shadow(0 6px 14px rgba(74, 59, 234, .35)); }
  .hero-icon svg { width: 100%; height: 100%; }
  .hero h1 { font-family: var(--font-display); font-size: 22px; font-weight: 600; margin: 0 0 3px; letter-spacing: -.2px; }
  .hero p { margin: 0; color: var(--text-2); line-height: 1.45; }

  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    margin: 0 2px 8px; color: var(--text-2); font-size: 12px; font-weight: 600;
  }
  .ghost {
    border: 0; background: transparent; color: var(--accent);
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 8px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
  }
  .ghost:hover { background: var(--accent-soft); }
  .ghost:disabled { opacity: .5; cursor: default; background: transparent; }
  .ghost svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; }
  .ghost.spinning svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Monitor cards ─────────────────────────── */
  .list { display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 232px; padding: 2px; margin: -2px; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 3px; }

  .card {
    width: 100%; text-align: left;
    display: flex; align-items: center; gap: 14px;
    padding: 14px 16px;
    background: var(--card);
    border: 1px solid var(--stroke);
    border-radius: 10px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .15s;
  }
  .card:hover { background: var(--card-hover); }
  .card:active { transform: scale(.995); }
  .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), var(--shadow); }
  .card.unsupported .mon, .card.unsupported .name { opacity: .55; }

  .mon {
    width: 40px; height: 40px; border-radius: 9px; flex: none;
    display: grid; place-items: center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.25);
  }
  .card.unsupported .mon { background: var(--stroke-strong); box-shadow: none; }
  .mon svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .info { flex: 1; min-width: 0; }
  .name { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
  .name span.t { overflow: hidden; text-overflow: ellipsis; }
  .meta { color: var(--text-3); font-size: 12px; margin-top: 3px; }

  .chip {
    font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); flex: none;
  }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.ok { background: transparent; color: var(--ok); padding: 0; }

  .level { width: 74px; flex: none; text-align: right; }
  .level .pct { font-family: var(--font-display); font-size: 15px; font-weight: 600; }
  .level .bar { height: 4px; border-radius: 2px; background: var(--stroke-strong); margin-top: 6px; overflow: hidden; }
  .level .bar i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--amber), var(--amber-2)); }

  .radio {
    width: 18px; height: 18px; border-radius: 50%; flex: none;
    border: 1.5px solid var(--stroke-strong);
    display: grid; place-items: center; transition: border-color .15s;
  }
  .card.selected .radio { border-color: var(--accent); border-width: 5px; }

  .skeleton { height: 70px; border-radius: 10px; background: var(--skeleton); position: relative; overflow: hidden; }
  .skeleton::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
    animation: shimmer 1.3s infinite;
  }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }

  .empty { padding: 26px 12px; text-align: center; color: var(--text-3); border: 1px dashed var(--stroke-strong); border-radius: 10px; }

  /* ── Notice + apply ────────────────────────── */
  .notice {
    display: none; gap: 10px; align-items: flex-start;
    margin-top: 12px; padding: 10px 12px; border-radius: 8px;
    line-height: 1.5; font-size: 12.5px;
    background: var(--accent-soft); color: var(--text);
  }
  .notice.show { display: flex; animation: fade .2s ease; }
  .notice.k-warn { background: var(--warn-soft); }
  .notice.k-err { background: var(--err-soft); }
  .notice svg { width: 16px; height: 16px; flex: none; margin-top: 1px; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke: var(--accent); }
  .notice.k-warn svg { stroke: var(--warn); }
  .notice.k-err svg { stroke: var(--err); }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } }

  .apply-row { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .primary {
    height: 36px; padding: 0 22px; border: 0; border-radius: 8px;
    color: #fff; font-weight: 600; font-size: 13px; cursor: pointer;
    background: linear-gradient(135deg, #3a6bff, #6b3bea);
    box-shadow: 0 4px 14px rgba(74, 59, 234, .35), inset 0 1px 0 rgba(255,255,255,.2);
    display: inline-flex; align-items: center; gap: 7px;
    transition: filter .15s, transform .1s, box-shadow .15s, opacity .15s;
  }
  .primary:hover { filter: brightness(1.08); }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { cursor: default; filter: grayscale(.6); opacity: .45; box-shadow: none; transform: none; }
  .primary.done { background: var(--card); color: var(--ok); opacity: 1; filter: none; border: 1px solid var(--stroke); }
  .primary svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .status { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 12px; min-width: 0; }
  .status .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .status.on .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); animation: pulse 2s infinite; }
  .status.pending .dot { background: var(--amber); }
  .status.err .dot { background: var(--err); }
  @keyframes pulse { 50% { box-shadow: 0 0 0 5px color-mix(in srgb, var(--ok) 0%, transparent); } }

  /* ── Settings ──────────────────────────────── */
  .settings { margin-top: auto; padding-top: 20px; }
  .settings .group { background: var(--card); border: 1px solid var(--stroke); border-radius: 10px; box-shadow: var(--shadow); }
  .row { display: flex; align-items: center; gap: 12px; padding: 12px 16px; cursor: pointer; }
  .row + .row { border-top: 1px solid var(--stroke); }
  .row .ico { width: 18px; height: 18px; fill: none; stroke: var(--text-2); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .row .txt { flex: 1; }
  .row .t { font-weight: 600; }
  .row .s { color: var(--text-3); font-size: 12px; margin-top: 2px; }

  .toggle { appearance: none; width: 40px; height: 20px; border-radius: 10px; margin: 0; flex: none; cursor: pointer;
    border: 1px solid var(--text-2); background: transparent; position: relative; transition: background .15s, border-color .15s; }
  .toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--text-2); transition: transform .18s cubic-bezier(.3,.7,.4,1.3), background .15s; }
  .toggle:checked { background: linear-gradient(135deg, #3a6bff, #6b3bea); border-color: transparent; }
  .toggle:checked::after { background: #fff; transform: translateX(20px); }
  .toggle:active::after { width: 15px; }

  .foot { margin-top: 12px; text-align: center; color: var(--text-3); font-size: 11px; }
</style>
</head>
<body>
  <div class="titlebar" id="titlebar">
    <div class="brand" id="drag">{{ICON}}<span>BrightTray</span></div>
    <button class="win-btn" id="btn-min" title="最小化">
      <svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg>
    </button>
    <button class="win-btn close" id="btn-close" title="关闭">
      <svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg>
    </button>
  </div>

  <main>
    <section class="hero" id="hero">
      <div class="hero-icon">{{ICON}}</div>
      <div>
        <h1>选择显示器</h1>
        <p>选好后点击应用，快速设置里的亮度条就会通过 DDC/CI 调节这台显示器。</p>
      </div>
    </section>

    <div class="section-head">
      <span>已连接的显示器</span>
      <button class="ghost" id="btn-refresh">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
        <span>刷新</span>
      </button>
    </div>
    <div class="list" id="list"></div>

    <div class="notice" id="notice">
      <svg viewBox="0 0 16 16" id="notice-ico"></svg>
      <div id="notice-text"></div>
    </div>

    <div class="apply-row">
      <button class="primary" id="btn-apply" disabled><span>应用</span></button>
      <div class="status" id="status"><span class="dot"></span><span class="txt" id="status-text">未启用</span></div>
    </div>

    <section class="settings">
      <div class="group">
        <label class="row">
          <svg class="ico" viewBox="0 0 20 20"><path d="M10 2.5v6M5.4 5.2a6.5 6.5 0 1 0 9.2 0"/></svg>
          <div class="txt"><div class="t">开机自启动</div><div class="s">登录后在托盘中静默运行，并自动控制已应用的显示器</div></div>
          <input type="checkbox" class="toggle" id="opt-autostart">
        </label>
        <label class="row">
          <svg class="ico" viewBox="0 0 20 20"><path d="M3 13.5h14M6 16.5h8M4.5 3.5h11a1.5 1.5 0 0 1 1.5 1.5v5.5H3V5a1.5 1.5 0 0 1 1.5-1.5z"/></svg>
          <div class="txt"><div class="t">关闭时最小化到托盘</div><div class="s">关闭窗口后继续在后台工作</div></div>
          <input type="checkbox" class="toggle" id="opt-tray">
        </label>
      </div>
      <div class="foot" id="foot">BrightTray</div>
    </section>
  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const send = (msg) => window.ipc.postMessage(msg);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const ICONS = {
    info: '<circle cx="8" cy="8" r="6.5"/><path d="M8 7.2v4M8 4.8v.01"/>',
    warn: '<path d="M8 1.8l6.6 11.7H1.4z"/><path d="M8 6.3v3.4M8 11.6v.01"/>',
    err:  '<circle cx="8" cy="8" r="6.5"/><path d="M5.7 5.7l4.6 4.6M10.3 5.7l-4.6 4.6"/>',
  };
  const MONITOR = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg>';
  const CHECK = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  let state = null;
  let selected = null;

  function hookText(s) {
    switch (s.hook.kind) {
      case "hooked": return { cls: "on", text: "运行中 · 快速设置亮度条已就绪" };
      case "waiting": return { cls: "pending", text: "运行中 · 正在等待 ShellHost" };
      case "starting": return { cls: "pending", text: "正在挂接快速设置…" };
      case "missing": return { cls: "err", text: "找不到 brighttray_hook.dll" };
      case "error": return { cls: "err", text: s.hook.message };
      default: return { cls: "", text: "未启用" };
    }
  }

  function render() {
    if (!state) return;
    document.body.classList.toggle("mica", !!state.mica);
    $("opt-autostart").checked = !!state.autostart;
    $("opt-tray").checked = !!state.closeToTray;
    $("foot").textContent = "BrightTray " + state.version;

    // Keep the user's pick; otherwise fall back to what is applied/saved, then the first capable one.
    const keys = state.monitors.map((m) => m.key);
    if (!keys.includes(selected)) {
      selected = [state.applied, state.saved].find((k) => k && keys.includes(k))
        || (state.monitors.find((m) => m.ddc) || {}).key
        || null;
    }

    const list = $("list");
    const refresh = $("btn-refresh");
    refresh.disabled = state.scanning;
    refresh.classList.toggle("spinning", state.scanning);

    if (state.scanning && state.monitors.length === 0) {
      list.innerHTML = '<div class="skeleton"></div><div class="skeleton" style="opacity:.6"></div>';
    } else if (state.monitors.length === 0) {
      list.innerHTML = '<div class="empty">没有检测到显示器</div>';
    } else {
      list.innerHTML = state.monitors.map((m) => {
        const cls = ["card", m.key === selected ? "selected" : "", m.ddc ? "" : "unsupported"].join(" ");
        const chips = m.primary ? '<span class="chip">主显示器</span>' : "";
        const active = m.key === state.applied ? ' · <span class="chip ok">● 控制中</span>' : "";
        const right = m.ddc
          ? `<div class="level"><div class="pct">${m.percent}%</div><div class="bar"><i style="width:${m.percent}%"></i></div></div>`
          : '<span class="chip warn">不支持 DDC/CI</span>';
        return `<button class="${cls}" data-key="${esc(m.key)}">
            <div class="mon">${MONITOR}</div>
            <div class="info">
              <div class="name"><span class="t">${esc(m.name)}</span>${chips}</div>
              <div class="meta">${m.width} × ${m.height} · ${esc(m.device)}${active}</div>
            </div>
            ${right}
            <div class="radio"></div>
          </button>`;
      }).join("");
    }

    const mon = state.monitors.find((m) => m.key === selected);
    const isApplied = mon && mon.key === state.applied;

    // Notice
    let notice = null;
    if (state.error) notice = { kind: "err", text: state.error };
    else if (mon && !mon.ddc) notice = { kind: "warn", text: "这台显示器没有响应 DDC/CI，BrightTray 不会对它做任何修改。可以在显示器的 OSD 菜单中开启 DDC/CI 后点击刷新。" };
    else if (mon && !isApplied) notice = { kind: "info", text: state.applied
        ? "点击应用后，快速设置亮度条将改为控制这台显示器。"
        : "点击应用后开始工作：快速设置里会出现亮度条，拖动即可调节这台显示器。" };
    const n = $("notice");
    n.className = "notice" + (notice ? " show k-" + notice.kind : "");
    if (notice) {
      $("notice-ico").innerHTML = ICONS[notice.kind];
      $("notice-text").textContent = notice.text;
    }

    // Apply button
    const apply = $("btn-apply");
    // A background rescan (e.g. on focus) must not swallow the click that focused the window,
    // so scanning only affects the refresh button. Rust re-validates the key on apply.
    apply.disabled = !mon || !mon.ddc || isApplied;
    apply.classList.toggle("done", !!isApplied);
    apply.innerHTML = isApplied ? CHECK + "<span>已应用</span>" : "<span>应用</span>";

    // Status
    const st = state.applied ? hookText(state) : { cls: "", text: "未启用 · 选择显示器后点击应用" };
    $("status").className = "status " + st.cls;
    $("status-text").textContent = st.text;
    $("status-text").title = st.text;
  }

  window.bt = { render: (s) => { state = s; render(); } };

  $("list").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    selected = card.dataset.key;
    if (state) state.error = null;
    render();
  });
  $("btn-apply").addEventListener("click", () => { if (selected) send("apply:" + selected); });
  $("btn-refresh").addEventListener("click", () => send("refresh"));
  $("opt-autostart").addEventListener("change", (e) => send("autostart:" + (e.target.checked ? "on" : "off")));
  $("opt-tray").addEventListener("change", (e) => send("tray:" + (e.target.checked ? "on" : "off")));
  $("btn-min").addEventListener("click", () => send("minimize"));
  $("btn-close").addEventListener("click", () => send("close"));
  $("drag").addEventListener("mousedown", (e) => { if (e.button === 0) send("drag"); });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    if (e.key === "F5" || (e.ctrlKey && e.key.toLowerCase() === "r")) { e.preventDefault(); send("refresh"); }
  });

  send("ready");
})();
</script>
</body>
</html>
