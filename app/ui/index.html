<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrightTray</title>
<style>
  /*
   * Layout grid (CSS px, window width 420):
   *   cards sit on a 16px gutter and pad their content by 14px, so everything shares
   *   one left axis at x = 30 and one right axis at x = 390:
   *     brand icon · section label · monitor glyph · status dot · notice icon · toggle   → left axis
   *     refresh glyph · radio · Apply button                                              → right axis
   *   Vertical spacing is on an 8px rhythm.
   */
  :root {
    color-scheme: light dark;
    --font: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    --font-display: "Segoe UI Variable Display", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    --gutter: 16px;
    --inset: 14px;
    --radius: 10px;

    /* Light: neutral grays, ink-black as the only emphasis */
    --bg-solid: #f4f4f4;
    --surface: #ffffff;
    --surface-hover: #fbfbfb;
    --surface-2: #eeeeee;
    --surface-sel: #ffffff;
    --stroke: rgba(0, 0, 0, 0.08);
    --stroke-strong: rgba(0, 0, 0, 0.16);
    --ink: #161616;
    --text: #161616;
    --text-2: #555555;
    --text-3: #9b9b9b;
    --on-ink: #ffffff;
    --ok: #22a35a;
    --err: #d93025;
    --err-soft: rgba(217, 48, 37, 0.08);
    --notice: rgba(0, 0, 0, 0.045);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    --shadow-sel: 0 0 0 1px var(--ink), 0 2px 8px rgba(0, 0, 0, 0.06);
    --skeleton: rgba(0, 0, 0, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg-solid: #141414;
      --surface: rgba(255, 255, 255, 0.035);
      --surface-hover: rgba(255, 255, 255, 0.06);
      --surface-2: rgba(255, 255, 255, 0.07);
      --surface-sel: rgba(255, 255, 255, 0.07);
      --stroke: rgba(255, 255, 255, 0.07);
      --stroke-strong: rgba(255, 255, 255, 0.16);
      --ink: #f2f2f2;
      --text: #f2f2f2;
      --text-2: #a6a6a6;
      --text-3: #686868;
      --on-ink: #141414;
      --ok: #4cc77f;
      --err: #ff6b61;
      --err-soft: rgba(255, 107, 97, 0.1);
      --notice: rgba(255, 255, 255, 0.05);
      --shadow: none;
      --shadow-sel: 0 0 0 1px rgba(255, 255, 255, 0.55);
      --skeleton: rgba(255, 255, 255, 0.05);
    }
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: var(--font);
    font-size: 13px;
    color: var(--text);
    background: var(--bg-solid);
    overflow: hidden;
    user-select: none;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  /* ── Title bar ─────────────────────────────── */
  .titlebar { height: 40px; display: flex; align-items: center; padding-left: calc(var(--gutter) + var(--inset)); }
  .brand { display: flex; align-items: center; gap: 8px; flex: 1; height: 100%;
    font-size: 12px; font-weight: 600; color: var(--text-2); }
  .brand svg { width: 16px; height: 16px; flex: none; }
  .win-btn { width: 46px; height: 40px; border: 0; background: transparent;
    display: grid; place-items: center; transition: background .12s; }
  .win-btn svg { width: 10px; height: 10px; stroke: var(--text-2); stroke-width: 1; fill: none; }
  .win-btn:hover { background: var(--surface-2); }
  .win-btn.close:hover { background: #c42b1c; }
  .win-btn.close:hover svg { stroke: #fff; }

  /* ── Content ───────────────────────────────── */
  #app { padding: 8px var(--gutter) var(--gutter); }

  /* The refresh button is 28px wide with a 14px glyph; 7px of right padding puts the glyph's
     right edge on the right axis. */
  .head { height: 28px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 7px 0 var(--inset); margin-bottom: 8px; }
  .head h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--text-2); }
  .icon-btn { width: 28px; height: 28px; border: 0; border-radius: 6px; background: transparent;
    display: grid; place-items: center; cursor: pointer; color: var(--text-2); transition: background .12s, color .12s; }
  .icon-btn:hover { background: var(--surface-2); color: var(--text); }
  .icon-btn:disabled { cursor: default; }
  .icon-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn.spinning svg { animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .list { display: flex; flex-direction: column; gap: 8px; max-height: 216px; overflow-y: auto; padding: 1px; margin: -1px; }
  .list::-webkit-scrollbar { width: 6px; }
  .list::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 3px; }

  .card {
    width: 100%; height: 64px; flex: none; text-align: left;
    display: flex; align-items: center; gap: 12px; padding: 0 var(--inset);
    border-radius: var(--radius); cursor: pointer;
    background: var(--surface); border: 0; box-shadow: 0 0 0 1px var(--stroke), var(--shadow);
    transition: background .15s, box-shadow .15s;
  }
  .card:hover { background: var(--surface-hover); }
  .card.selected { background: var(--surface-sel); box-shadow: var(--shadow-sel); }
  .card.unsupported .glyph, .card.unsupported .name { opacity: .45; }

  .glyph { width: 36px; height: 36px; border-radius: 8px; flex: none; display: grid; place-items: center;
    background: var(--surface-2); color: var(--text-2); transition: background .15s, color .15s; }
  .card.selected .glyph { background: var(--ink); color: var(--on-ink); }
  .glyph svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .name { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; line-height: 18px; white-space: nowrap; }
  .name .t { overflow: hidden; text-overflow: ellipsis; }
  .meta { font-size: 11.5px; line-height: 15px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tag { font-size: 10px; font-weight: 600; color: var(--text-2); background: var(--surface-2);
    padding: 0 5px; border-radius: 4px; line-height: 16px; flex: none; }
  .live { color: var(--text); font-weight: 600; }

  .level { width: 56px; flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .level .pct { font-family: var(--font-display); font-size: 14px; font-weight: 600; line-height: 18px; font-variant-numeric: tabular-nums; }
  .level .bar { width: 100%; height: 3px; border-radius: 2px; background: var(--stroke-strong); overflow: hidden; }
  .level .bar i { display: block; height: 100%; border-radius: 2px; background: var(--ink); }
  .nosupport { font-size: 11.5px; color: var(--text-3); flex: none; }

  .radio { width: 16px; height: 16px; border-radius: 50%; flex: none; margin-left: 4px;
    box-shadow: inset 0 0 0 1.5px var(--stroke-strong); transition: box-shadow .15s; }
  .card.selected .radio { box-shadow: inset 0 0 0 5px var(--ink); }

  .skeleton { height: 64px; border-radius: var(--radius); background: var(--skeleton); position: relative; overflow: hidden; }
  .skeleton::after { content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent); animation: shimmer 1.3s infinite; }
  @keyframes shimmer { from { transform: translateX(-100%); } to { transform: translateX(100%); } }
  .empty { height: 64px; display: grid; place-items: center; color: var(--text-3);
    border-radius: var(--radius); box-shadow: inset 0 0 0 1px var(--stroke-strong); }

  /* `display:none` would take the role="alert" node out of the accessibility tree and put it
     back in the same tick as its text, which is the unreliable way to announce. It collapses
     to zero height instead, so it is always present and only its text changes. */
  .notice { display: flex; gap: 8px; align-items: flex-start; margin-top: 0; padding: 0 var(--inset);
    border-radius: 8px; font-size: 12px; line-height: 18px; background: var(--notice); color: var(--text-2);
    height: 0; overflow: hidden; }
  .notice.show { height: auto; margin-top: 8px; padding: 8px var(--inset); animation: fade .2s ease; }
  .notice.k-err { background: var(--err-soft); color: var(--err); }
  .notice svg { width: 14px; height: 14px; flex: none; margin-top: 2px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  @keyframes fade { from { opacity: 0; transform: translateY(-2px); } }

  /* ── Status + footer ───────────────────────── */
  .status { height: 20px; display: flex; align-items: center; gap: 8px; margin-top: 16px; padding: 0 var(--inset);
    font-size: 12px; color: var(--text-2); min-width: 0; }
  .status .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .status.on .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 20%, transparent); }
  .status.pending .dot { background: var(--text-2); animation: blink 1s ease-in-out infinite; }
  .status.err .dot { background: var(--err); }
  .status.err .txt { color: var(--err); }
  @keyframes blink { 50% { opacity: .3; } }

  .footer { display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 16px; padding: 16px var(--inset) 0; border-top: 1px solid var(--stroke); }
  .opt { display: flex; align-items: center; gap: 10px; cursor: pointer; color: var(--text-2); font-size: 12.5px; }
  .opt:hover { color: var(--text); }

  .toggle { appearance: none; width: 36px; height: 20px; border-radius: 10px; margin: 0; flex: none; cursor: pointer;
    background: transparent; box-shadow: inset 0 0 0 1.5px var(--stroke-strong); position: relative;
    transition: background .15s, box-shadow .15s; }
  .toggle::after { content: ""; position: absolute; top: 4px; left: 4px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--text-2); transition: transform .18s cubic-bezier(.3,.7,.4,1.3), background .15s; }
  .toggle:checked { background: var(--ink); box-shadow: none; }
  .toggle:checked::after { background: var(--on-ink); transform: translateX(16px); }

  .primary { height: 32px; min-width: 88px; padding: 0 16px; border: 0; border-radius: 8px; cursor: pointer;
    font-weight: 600; font-size: 12.5px; color: var(--on-ink); background: var(--ink);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    transition: transform .1s, opacity .15s; }
  .primary:hover { opacity: .88; }
  .primary:active { transform: translateY(1px); }
  .primary:disabled { cursor: default; opacity: .25; transform: none; }
  .primary.done { background: var(--surface-2); color: var(--text); opacity: 1; }
  .primary svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  /* ── Keyboard focus ────────────────────────── */
  /* An outline in the ink colour, never the selection border (--shadow-sel), so "focused" and
     "selected" stay distinguishable; :focus-visible keeps it off mouse clicks. The list is a
     scroll container that clips anything outside its 1px padding, and the title bar sits on
     the window edge, so those two rings are drawn inset. */
  .card:focus-visible, .win-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: -2px; }
  .icon-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }
  .primary:focus-visible, .toggle:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
  <div class="titlebar">
    <div class="brand" id="drag">{{ICON}}<span>BrightTray</span></div>
    <button class="win-btn" id="btn-min" data-title="minimize">
      <svg viewBox="0 0 10 10"><path d="M0 5.5h10"/></svg>
    </button>
    <button class="win-btn close" id="btn-close" data-title="close">
      <svg viewBox="0 0 10 10"><path d="M.5.5l9 9M9.5.5l-9 9"/></svg>
    </button>
  </div>

  <div id="app">
    <div class="head">
      <h2 data-t="displays" id="displays-title"></h2>
      <button class="icon-btn" id="btn-refresh" data-title="refresh">
        <svg viewBox="0 0 16 16"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3"/></svg>
      </button>
    </div>
    <div class="list" id="list" role="radiogroup" aria-labelledby="displays-title"></div>

    <div class="notice" id="notice" role="alert">
      <svg viewBox="0 0 16 16" id="notice-ico"></svg>
      <div id="notice-text"></div>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"><span class="dot"></span><span class="txt" id="status-text"></span></div>

    <div class="footer">
      <label class="opt">
        <input type="checkbox" class="toggle" id="opt-autostart">
        <span data-t="autostart"></span>
      </label>
      <button class="primary" id="btn-apply" disabled></button>
    </div>
  </div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);

  const STRINGS = {
    zh: {
      displays: "显示器", autostart: "开机自启动", apply: "应用", applied: "已应用",
      refresh: "刷新", minimize: "最小化", close: "关闭",
      primary: "主", active: "控制中", noDdc: "不支持 DDC/CI", empty: "没有检测到显示器",
      noDdcNotice: "该显示器未响应 DDC/CI，不会做任何修改。可在显示器菜单中开启 DDC/CI 后刷新。",
      idle: "未启用", running: "运行中", waiting: "等待 ShellHost…", hooking: "正在挂接快速设置…",
      missing: "找不到 brighttray_hook.dll", starting: "启动中…",
      unsupported: "系统版本不受支持",
      unsupportedNotice: "当前系统版本（build {build}）不受支持。快速设置亮度条需要 Windows 11 24H2（build {min}）或更新版本，未做任何修改。",
    },
    en: {
      displays: "Displays", autostart: "Start with Windows", apply: "Apply", applied: "Applied",
      refresh: "Refresh", minimize: "Minimize", close: "Close",
      primary: "Main", active: "Active", noDdc: "No DDC/CI", empty: "No displays found",
      noDdcNotice: "This display doesn't respond to DDC/CI, so nothing will be changed. Turn on DDC/CI in the monitor's menu, then refresh.",
      idle: "Not active", running: "Running", waiting: "Waiting for ShellHost…", hooking: "Hooking Quick Settings…",
      missing: "brighttray_hook.dll not found", starting: "Starting…",
      unsupported: "Unsupported Windows version",
      unsupportedNotice: "This Windows version (build {build}) isn't supported. The Quick Settings brightness slider needs Windows 11 24H2 (build {min}) or later. Nothing was changed.",
    },
  };
  const T = STRINGS[document.documentElement.lang] || STRINGS.en;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T[el.dataset.t]; });
  // The icon-only buttons have no text of their own, so their name comes from the same string
  // the tooltip uses.
  document.querySelectorAll("[data-title]").forEach((el) => {
    el.title = T[el.dataset.title];
    el.setAttribute("aria-label", el.title);
  });
  $("btn-apply").textContent = T.apply;
  const send = (msg) => window.ipc.postMessage(msg);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const ICONS = {
    warn: '<path d="M8 1.8l6.6 11.7H1.4z"/><path d="M8 6.3v3.4M8 11.6v.01"/>',
    err:  '<circle cx="8" cy="8" r="6.5"/><path d="M5.7 5.7l4.6 4.6M10.3 5.7l-4.6 4.6"/>',
  };
  const MONITOR = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M9 20h6M12 16v4"/></svg>';
  const CHECK = '<svg viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7"/></svg>';

  let state = null;
  let selected = null;
  let lastHeight = 0;
  // Set from the host's state: the Quick Settings hook cannot work on this Windows build.
  let unsupported = false;

  function statusOf(s) {
    if (unsupported) return { cls: "err", text: T.unsupported };
    if (!s.applied) return { cls: "", text: T.idle };
    switch (s.hook.kind) {
      case "hooked": return { cls: "on", text: T.running };
      case "waiting": return { cls: "pending", text: T.waiting };
      case "starting": return { cls: "pending", text: T.hooking };
      case "missing": return { cls: "err", text: T.missing };
      case "error": return { cls: "err", text: s.hook.message };
      default: return { cls: "pending", text: T.starting };
    }
  }

  // The window is sized to its content; tell the host whenever the height changes.
  function fit() {
    const h = Math.ceil(document.querySelector(".titlebar").offsetHeight + $("app").offsetHeight);
    if (h !== lastHeight) { lastHeight = h; send("size:" + h); }
  }

  function render() {
    if (!state) return;
    unsupported = !!state.os && !state.os.supported;
    $("opt-autostart").checked = !!state.autostart;

    const keys = state.monitors.map((m) => m.key);
    if (!keys.includes(selected)) {
      selected = [state.applied, state.saved].find((k) => k && keys.includes(k))
        || (state.monitors.find((m) => m.ddc) || {}).key
        || null;
    }

    const refresh = $("btn-refresh");
    refresh.disabled = state.scanning;
    refresh.classList.toggle("spinning", state.scanning);
    // The scan is a silent visual state otherwise; aria-busy tells assistive technology that
    // the list is being replaced rather than that nothing happened.
    $("list").setAttribute("aria-busy", String(!!state.scanning));

    const list = $("list");
    if (state.scanning && state.monitors.length === 0) {
      list.innerHTML = '<div class="skeleton"></div>';
    } else if (state.monitors.length === 0) {
      list.innerHTML = `<div class="empty">${T.empty}</div>`;
    } else {
      list.innerHTML = state.monitors.map((m) => {
        const cls = ["card", m.key === selected ? "selected" : "", m.ddc ? "" : "unsupported"].join(" ");
        const live = m.key === state.applied ? ` · <span class="live">${T.active}</span>` : "";
        const right = m.ddc
          ? `<div class="level"><div class="pct">${m.percent}%</div><div class="bar"><i style="width:${m.percent}%"></i></div></div>`
          : `<span class="nosupport">${T.noDdc}</span>`;
        // The visible children are a stack of nested divs, so they would be read as unrelated
        // text. One explicit label carries the same facts in words, without the separators.
        const label = [
          m.name,
          m.primary ? T.primary : "",
          `${m.width} × ${m.height}`,
          m.device,
          m.ddc ? `${m.percent}%` : T.noDdc,
          m.key === state.applied ? T.active : "",
        ].filter(Boolean).join(", ");
        // Radiogroup pattern: exactly one checked card, and one tab stop for the whole group.
        // With nothing selected (every display is non-DDC), the tab stop still goes to the
        // first card: a group with no tab stop at all cannot be entered from the keyboard.
        const tabStop = selected !== null ? selected : (state.monitors[0] || {}).key;
        return `<button class="${cls}" data-key="${esc(m.key)}" role="radio" aria-checked="${m.key === selected}" tabindex="${m.key === tabStop ? 0 : -1}" aria-label="${esc(label)}">
            <div class="glyph">${MONITOR}</div>
            <div class="info">
              <div class="name"><span class="t">${esc(m.name)}</span>${m.primary ? `<span class="tag">${T.primary}</span>` : ""}</div>
              <div class="meta">${m.width} × ${m.height} · ${esc(m.device)}${live}</div>
            </div>
            ${right}
            <div class="radio"></div>
          </button>`;
      }).join("");
    }

    const mon = state.monitors.find((m) => m.key === selected);
    const isApplied = !!mon && mon.key === state.applied;

    let notice = null;
    if (state.error) notice = { kind: "err", text: state.error };
    else if (unsupported) notice = { kind: "warn",
      text: T.unsupportedNotice.replace("{build}", state.os.build).replace("{min}", state.os.min) };
    else if (mon && !mon.ddc) notice = { kind: "warn", text: T.noDdcNotice };
    const n = $("notice");
    n.className = "notice" + (notice ? " show k-" + notice.kind : "");
    if (notice) {
      $("notice-ico").innerHTML = ICONS[notice.kind];
      $("notice-text").textContent = notice.text;
    } else if ($("notice-text").textContent) {
      // Clearing it is what makes the *next* identical message a text change worth announcing.
      $("notice-ico").innerHTML = "";
      $("notice-text").textContent = "";
    }

    // A background rescan (e.g. on focus) must not swallow the click that focused the window,
    // so scanning only affects the refresh button. Rust re-validates the key on apply.
    const apply = $("btn-apply");
    apply.disabled = unsupported || !mon || !mon.ddc || isApplied;
    apply.classList.toggle("done", isApplied);
    apply.innerHTML = isApplied ? CHECK + T.applied : T.apply;

    const st = statusOf(state);
    $("status").className = "status " + st.cls;
    $("status-text").textContent = st.text;
    $("status-text").title = st.text;

    fit();
  }

  window.bt = { render: (s) => { state = s; render(); } };
  // Re-fit on any layout change too (fonts loading, DPI changes), not only on render.
  new ResizeObserver(fit).observe($("app"));

  $("list").addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    // render() replaces the markup, so a keyboard user (or an assistive technology that
    // synthesizes a click) would otherwise lose focus to <body>.
    const hadFocus = $("list").contains(document.activeElement);
    selected = card.dataset.key;
    if (state) state.error = null;
    render();
    if (hadFocus) focusSelected();
  });

  // render() replaces the list markup, so focus is restored by key through a fresh lookup
  // instead of a node reference. The cards are scanned rather than selected by attribute
  // because a key looks like "\\.\DISPLAY1#0|Name", which an attribute selector cannot hold.
  function focusSelected() {
    const card = Array.from($("list").querySelectorAll(".card")).find((c) => c.dataset.key === selected);
    if (card) card.focus();
  }

  // The radiogroup keyboard pattern: Tab enters the group once, arrows move inside it.
  $("list").addEventListener("keydown", (e) => {
    if (!state || state.monitors.length === 0) return;
    // Ctrl/Cmd/Alt + arrow is a browser or shell shortcut, not a move inside the group.
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const keys = state.monitors.map((m) => m.key);
    const at = Math.max(keys.indexOf(selected), 0);
    let next;
    switch (e.key) {
      case "ArrowUp":
      case "ArrowLeft": next = keys[(at - 1 + keys.length) % keys.length]; break;
      case "ArrowDown":
      case "ArrowRight": next = keys[(at + 1) % keys.length]; break;
      case "Home": next = keys[0]; break;
      case "End": next = keys[keys.length - 1]; break;
      case "Enter":
      case " ":
        // Cancelling the default also suppresses the click a <button> would emit.
        e.preventDefault();
        // The focused card is the truth; `selected` is only the fallback when focus is not on
        // a card. With neither, there is nothing to apply and `apply:null` would be a lie.
        const focused = document.activeElement && document.activeElement.closest
          ? document.activeElement.closest(".card") : null;
        const key = focused ? focused.dataset.key : selected;
        if (key) send("apply:" + key);
        return;
      default:
        // Everything else (F5, Ctrl+R, Tab, …) is not ours to consume.
        return;
    }
    e.preventDefault();
    selected = next;
    // Same as a mouse click on a card: choosing a display clears a stale error message.
    state.error = null;
    render();
    focusSelected();
  });
  $("btn-apply").addEventListener("click", () => { if (selected) send("apply:" + selected); });
  $("btn-refresh").addEventListener("click", () => send("refresh"));
  $("opt-autostart").addEventListener("change", (e) => send("autostart:" + (e.target.checked ? "on" : "off")));
  $("btn-min").addEventListener("click", () => send("minimize"));
  $("btn-close").addEventListener("click", () => send("close"));
  $("drag").addEventListener("mousedown", (e) => { if (e.button === 0) send("drag"); });
  document.addEventListener("contextmenu", (e) => e.preventDefault());
  document.addEventListener("keydown", (e) => {
    if (e.key === "F5" || (e.ctrlKey && e.key.toLowerCase() === "r")) { e.preventDefault(); send("refresh"); }
  });

  send("ready");
})();
</script>
</body>
</html>
